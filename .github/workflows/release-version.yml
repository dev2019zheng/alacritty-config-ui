name: Publish version release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish-macos:
    runs-on: macos-latest
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci --registry=https://registry.npmjs.org/

      - name: Derive release metadata
        run: python3 scripts/release_metadata.py --tag "$GITHUB_REF_NAME" --github-env "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features

      - name: Build release binary
        run: cargo build --release

      - name: Generate app icon assets
        run: python3 scripts/generate_app_icon.py

      - name: Package release artifacts
        run: bash scripts/package-macos-release.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: alacritty-config-ui-${{ env.RELEASE_TAG }}
          path: dist/upload/*
          if-no-files-found: error

      - name: Publish versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="$(mktemp)"
          dmg_note='- unsigned DMG (Apple certificate secrets not configured)'
          if [[ -n "$APPLE_CERTIFICATE" && -n "$APPLE_CERTIFICATE_PASSWORD" ]]; then
            dmg_note='- signed DMG without notarization (Apple notarization secrets not configured)'
            if [[ -n "$APPLE_ID" && -n "$APPLE_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
              dmg_note='- signed and notarized DMG'
            fi
          fi

          prerelease_flag=()
          release_kind='stable release'
          if [[ "$RELEASE_IS_PRERELEASE" == 'true' ]]; then
            prerelease_flag=(--prerelease)
            release_kind='pre-release'
          fi

          printf 'Automated %s for %s.\n\nArtifacts:\n- self-contained tar.gz runtime payload\n%s\n' \
            "$release_kind" \
            "$RELEASE_TAG" \
            "$dmg_note" > "$notes_file"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/upload/* --clobber
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file "$notes_file" \
              --verify-tag \
              "${prerelease_flag[@]}"
          else
            gh release create "$RELEASE_TAG" \
              dist/upload/* \
              --title "$RELEASE_TITLE" \
              --notes-file "$notes_file" \
              --verify-tag \
              "${prerelease_flag[@]}"
          fi
