name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci --registry=https://registry.npmjs.org/

      - name: Check release version metadata
        run: python3 scripts/release_metadata.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features

  package-smoke:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            runner: macos-latest
            python: python3
            package_command: bash scripts/package-macos-release.sh
          - name: windows
            runner: windows-latest
            python: python
            package_command: pwsh -File scripts/package-windows-release.ps1
          - name: linux
            runner: ubuntu-22.04
            python: python3
            package_command: bash scripts/package-linux-release.sh
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci --registry=https://registry.npmjs.org/

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Generate app icon assets
        run: ${{ matrix.python }} scripts/generate_app_icon.py

      - name: Package platform artifacts
        run: ${{ matrix.package_command }}

      - name: Upload smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-smoke-${{ matrix.name }}
          path: dist/upload/*
          if-no-files-found: error
