name: Publish master artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  publish-macos:
    runs-on: macos-latest
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci --registry=https://registry.npmjs.org/

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features

      - name: Build release binary
        run: cargo build --release

      - name: Generate app icon assets
        run: python3 scripts/generate_app_icon.py

      - name: Package release artifacts
        run: bash scripts/package-macos-release.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: alacritty-config-ui-macos-${{ github.sha }}
          path: dist/upload/*
          if-no-files-found: error

      - name: Publish rolling prerelease for master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view master-latest >/dev/null 2>&1; then
            gh release delete master-latest --yes --cleanup-tag
          fi

          dmg_note='- unsigned DMG (Apple certificate secrets not configured)'
          if [[ -n "$APPLE_CERTIFICATE" && -n "$APPLE_CERTIFICATE_PASSWORD" ]]; then
            dmg_note='- signed DMG without notarization (Apple notarization secrets not configured)'
            if [[ -n "$APPLE_ID" && -n "$APPLE_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
              dmg_note='- signed and notarized DMG'
            fi
          fi

          release_notes=$(printf 'Automated master build for commit %s.\n\nArtifacts:\n- self-contained tar.gz runtime payload\n%s' "$GITHUB_SHA" "$dmg_note")

          gh release create master-latest \
            dist/upload/* \
            --target "$GITHUB_SHA" \
            --title "master-latest" \
            --notes "$release_notes" \
            --prerelease
