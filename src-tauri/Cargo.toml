[package]
name = "alacritty-config-ui"
version = "0.2.1"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/dev2019zheng/alacritty-config-ui"
edition = "2024"

[lib]
name = "alacritty_config_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "alacritty-config-ui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.102"
dirs = "6.0.0"
font-kit = "0.14.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
toml = "1.1.2"
toml_edit = "0.25.11"

[dev-dependencies]
tempfile = "3.27.0"
